[general]
static = yes

[caller]
; the "outside caller": plays tones for a while, then hangs up
exten => call,1,NoOp(test caller)
 same => n,Playtones(800/400,0/400)
 same => n,Wait(12)
 same => n,Hangup()

[phone-in]
; phone 101: rings 2 s then answers and talks (tones) until the caller ends,
; unless DB test/noanswer is set
exten => _[0-9a-zA-Z+*#]!,1,Goto(s,1)
exten => s,1,GotoIf($[${DB_EXISTS(test/noanswer)}]?noans)
 same => n,Ringing()
 same => n,Wait(2)
 same => n,Answer()
 same => n,Playtones(500/300,0/300)
 same => n,Wait(60)
 same => n,Hangup()
 same => n(noans),Ringing()
 same => n,Wait(120)
 same => n,Hangup()

[from-santral]
exten => _[0-9a-zA-Z+*#]!,1,Hangup()
