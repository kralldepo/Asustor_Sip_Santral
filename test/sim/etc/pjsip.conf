[global]
type = global
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---------- provider side: SIP accounts SIP Santral registers to
[line1]
type = endpoint
context = from-santral
disallow = all
allow = alaw,ulaw
auth = line1
aors = line1
direct_media = no
from_user = +4917012345678
callerid = "Test Arayan" <+4917012345678>

[line1]
type = auth
auth_type = userpass
username = line1
password = line1pass

[line1]
type = aor
max_contacts = 1
remove_existing = yes

[line2]
type = endpoint
context = from-santral
disallow = all
allow = alaw,ulaw
auth = line2
aors = line2
direct_media = no
from_user = +4930999888
callerid = "Ikinci Arayan" <+4930999888>

[line2]
type = auth
auth_type = userpass
username = line2
password = line2pass

[line2]
type = aor
max_contacts = 1
remove_existing = yes

; ---------- phone side: registers to SIP Santral as extension 101
[phone101-auth]
type = auth
auth_type = userpass
username = 101
password = Ext101Pass1

[phone101]
type = registration
outbound_auth = phone101-auth
server_uri = sip:santral:5060
client_uri = sip:101@santral
contact_user = 101
retry_interval = 5
fatal_retry_interval = 5
forbidden_retry_interval = 5
auth_rejection_permanent = no
max_retries = 100000
expiration = 120
line = yes
endpoint = phone101

[phone101]
type = endpoint
context = phone-in
disallow = all
allow = alaw,ulaw
outbound_auth = phone101-auth
aors = phone101
direct_media = no

[phone101]
type = aor
contact = sip:santral:5060
